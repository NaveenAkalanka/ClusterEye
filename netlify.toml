# Netlify builds from the repo. Firebase settings come from the site's environment
# variables (VITE_FIREBASE_*, and VITE_ALLOW_SIGNUP=false for a single-user install).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built files have content hashes in their names, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The page itself is always revalidated, so a new deploy shows up straight away.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
